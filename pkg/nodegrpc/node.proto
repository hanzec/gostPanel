syntax = "proto3";

package yagp.node.v1;

option go_package = "yagp/pkg/nodegrpc";

import "google/protobuf/timestamp.proto";
import "observer.proto";

message CommandRequest {
  string method = 1;
  string path = 2;
  bytes body = 3;
}

message CommandReply {
  int32 status_code = 1;
  bytes body = 2;
}

message ListenerCheckRequest {
  string protocol = 1;
  string ip = 2;
  uint32 port = 3;
}

message ListenerCheckReply {
  bool available = 1;
  string reason = 2;
}

message ObserverEndpoint {
  string address = 1;
}

message GostServiceStatus {
  string unit = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
}

message GostLogsRequest {
  uint32 lines = 1;
}

message GostLogEntry {
  int64 timestamp_unix_micros = 1;
  string message = 2;
  int32 priority = 3;
}

message GostLogsReply {
  repeated GostLogEntry entries = 1;
}

message NftConfig {
  string config = 1;
  string table = 2;
  string live_config = 3;
}

message NodeConfig {
  bytes config_yaml = 1;
  string nft_template = 2;
}

message TrafficQuotaRequest {
  uint64 limit_bytes = 1;
  uint64 used_bytes = 2;
  int64 window_start = 3;
  repeated uint32 tcp_ports = 4;
  repeated uint32 udp_ports = 5;
  optional uint64 calibrated_used_bytes = 6;
}

message TrafficQuotaReply {
  uint64 used_bytes = 1;
  bool calibrated = 2;
}

message NodeUpgradeRequest {
  string component = 1;
  string version = 2;
}

message NodeUpgradeStatus {
  bool supported = 1;
  string gost_version = 2;
  string daemon_version = 3;
  string component = 4;
  string target_version = 5;
  string state = 6;
  string error = 7;
  bool runtime_update_required = 8;
}

message ReportRequest {
  uint64 node_id = 1;
  proto.ObserveRequest observation = 2;
}

message RegisterNodeRequest {
  reserved 2;
  reserved "node_certificate_pem";

  string token = 1;
  string ipv4 = 3;
  string ipv6 = 4;
}

message RegisterNodeReply {
  reserved 4;
  reserved "control_port";

  uint64 node_id = 1;
  string username = 2;
  string password = 3;
  NodeCredentials credentials = 5;
}

message NodeCredentials {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  int64 refresh_expires_at = 4;
}

message RefreshNodeRequest {
  uint64 node_id = 1;
  string refresh_token = 2;
  string request_id = 3;
}

message NodeIPsRequest {
  uint64 node_id = 1;
  string ipv4 = 2;
  string ipv6 = 3;
  repeated string addresses = 4;
  LocalIPSnapshot local_ip_snapshot = 5;
  optional bool mptcp_supported = 6;
}

// A present snapshot replaces the prior local addresses, including when empty.
message LocalIPSnapshot {
  repeated string addresses = 1;
}

message StreamFrame {
  // The sender allocates an ID for each call. Its reply repeats that ID.
  uint64 id = 1;
  // The operation name is present only on a call.
  string method = 2;
  bytes payload = 3;
  int32 code = 4;
  string error = 5;
  int64 timeout_millis = 6;
}

enum TransparentRedirectAction {
  TRANSPARENT_REDIRECT_ACTION_UNSPECIFIED = 0;
  TRANSPARENT_REDIRECT_ACTION_PREPARE = 1;
  TRANSPARENT_REDIRECT_ACTION_APPLY = 2;
  TRANSPARENT_REDIRECT_ACTION_REMOVE = 3;
}

message TransparentRedirectRequest {
  TransparentRedirectAction action = 1;
  string owner = 2;
  uint32 port = 3;
  string relay_host = 4;
  uint32 mark = 5;
  string docker_address = 6;
  bool require_active = 7;
  repeated string relay_hosts = 8;
}

message TransparentRedirectReply {
  uint32 mark = 1;
  string docker_address = 2;
  bool active = 3;
  bool multi_relay_supported = 4;
}

message TunnelProbeEndpoint {
  string address = 1;
  bytes token = 2;
}

message TunnelProbeRequest {
  string chain_name = 1;
  string address = 2;
  bytes token = 3;
}

message TunnelProbeReply {
  int64 round_trip_ms = 1;
}

message FirewallStatus {
  bool supported = 1;
  bool managed = 2;
  bool synchronized = 3;
  .google.protobuf.Timestamp last_sync = 4;
  optional string last_error = 5;
  string backend = 6;
}
