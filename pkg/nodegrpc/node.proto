syntax = "proto3";

package yagp.node.v1;

option go_package = "yagp/pkg/nodegrpc";

import "google/protobuf/empty.proto";
import "observer.proto";

message CommandRequest {
  string method = 1;
  string path = 2;
  bytes body = 3;
}

message CommandReply {
  int32 status_code = 1;
  bytes body = 2;
}

message ObserverEndpoint {
  string address = 1;
}

message GostServiceStatus {
  string unit = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
}

message GostLogsRequest {
  uint32 lines = 1;
}

message GostLogEntry {
  int64 timestamp_unix_micros = 1;
  string message = 2;
  int32 priority = 3;
}

message GostLogsReply {
  repeated GostLogEntry entries = 1;
}

message NftConfig {
  string config = 1;
}

message NftTemplateRequest {
  uint64 node_id = 1;
}

service Node {
  rpc Execute(CommandRequest) returns (CommandReply);
  rpc GetObserverEndpoint(google.protobuf.Empty) returns (ObserverEndpoint);
  rpc GetGostServiceStatus(google.protobuf.Empty) returns (GostServiceStatus);
  rpc RestartGostService(google.protobuf.Empty) returns (GostServiceStatus);
  rpc GetGostLogs(GostLogsRequest) returns (GostLogsReply);
  rpc GetNftConfig(google.protobuf.Empty) returns (NftConfig);
  rpc ApplyNftConfig(NftConfig) returns (NftConfig);
}

message ReportRequest {
  uint64 node_id = 1;
  proto.ObserveRequest observation = 2;
}

message RegisterNodeRequest {
  string token = 1;
  string node_certificate_pem = 2;
  string ipv4 = 3;
  string ipv6 = 4;
}

message RegisterNodeReply {
  uint64 node_id = 1;
  string username = 2;
  string password = 3;
  uint32 control_port = 4;
}

message NodeIPsRequest {
  uint64 node_id = 1;
  string ipv4 = 2;
  string ipv6 = 3;
}

service Panel {
  rpc Report(ReportRequest) returns (proto.ObserveReply);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeReply);
  rpc GetNftTemplate(NftTemplateRequest) returns (NftConfig);
  rpc UpdateNodeIPs(NodeIPsRequest) returns (google.protobuf.Empty);
}
