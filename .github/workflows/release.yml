name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build and Release
        run: |
          make release VERSION=${{ github.ref_name }}

      - name: Package binaries
        run: |
          # 打包 Linux amd64
          tar -czvf ycgp-linux-amd64.tar.gz ycgp-linux-amd64 config/config.yaml LICENSE
          # 打包 Linux arm64
          tar -czvf ycgp-linux-arm64.tar.gz ycgp-linux-arm64 config/config.yaml LICENSE
          # 打包 macOS amd64
          tar -czvf ycgp-darwin-amd64.tar.gz ycgp-darwin-amd64 config/config.yaml LICENSE
          # 打包 macOS arm64
          tar -czvf ycgp-darwin-arm64.tar.gz ycgp-darwin-arm64 config/config.yaml LICENSE
          # 打包 Windows
          zip ycgp-windows-amd64.zip ycgp-windows-amd64.exe config/config.yaml LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ycgp-*.tar.gz
            ycgp-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
