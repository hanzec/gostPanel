name: Build and Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  version:
    if: ${{ !github.event.deleted && (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          version=$(bash scripts/version.sh)
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate release changelog
        run: go run ./cmd/release-notes -repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - name: Build release binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make release VERSION="$VERSION"

      - name: Run Go tests and report coverage
        shell: bash
        run: |
          go test ./... -coverprofile "$RUNNER_TEMP/go-coverage.out"
          total=$(go tool cover -func "$RUNNER_TEMP/go-coverage.out" | awk '/^total:/ {print $NF}')
          printf '### Go test coverage\n\nStatement coverage: **%s**\n' "$total" >> "$GITHUB_STEP_SUMMARY"

      - name: Package binaries
        run: |
          # 打包 Linux amd64
          tar -czvf yagp-linux-amd64.tar.gz yagp-linux-amd64 config/config.yaml LICENSE
          # 打包 Linux arm64
          tar -czvf yagp-linux-arm64.tar.gz yagp-linux-arm64 config/config.yaml LICENSE
          # 打包 macOS amd64
          tar -czvf yagp-darwin-amd64.tar.gz yagp-darwin-amd64 config/config.yaml LICENSE
          # 打包 macOS arm64
          tar -czvf yagp-darwin-arm64.tar.gz yagp-darwin-arm64 config/config.yaml LICENSE
          # 打包 Windows
          zip yagp-windows-amd64.zip yagp-windows-amd64.exe config/config.yaml LICENSE
          tar -czvf yagp-daemon-linux-amd64.tar.gz yagp-daemon-linux-amd64 yagp-daemon-systemd-linux-amd64 LICENSE
          tar -czvf yagp-daemon-linux-arm64.tar.gz yagp-daemon-linux-arm64 yagp-daemon-systemd-linux-arm64 LICENSE

      - name: Check latest release eligibility
        id: latest
        run: |
          default_head=$(git ls-remote origin HEAD)
          if [[ "${default_head%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            yagp-*.tar.gz
            yagp-*.zip
          fail_on_unmatched_files: true
          overwrite_files: false
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: ${{ steps.latest.outputs.value }}

  docker:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
