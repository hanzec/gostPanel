name: Build and Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      upgrade_depoly:
        description: Upgrade the server's deployment tool
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    if: ${{ github.event_name == 'push' && !github.event.deleted && (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          version=$(bash scripts/version.sh)
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    name: Vue and Go tests
    if: ${{ github.event_name != 'workflow_dispatch' && !github.event.deleted }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Run Vue tests and report coverage
        working-directory: web
        run: |
          npm run test:coverage
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs"
            const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"))
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Vue test coverage\n\nStatement coverage: **" + total.statements.pct + "%**\n\n")
          '

      - name: Build frontend for Go tests
        run: npm --prefix web run build

      - name: Run Go tests and report coverage
        shell: bash
        run: |
          output="$RUNNER_TEMP/go-coverage"
          mkdir -p "$output"
          go mod download
          toolchain=$(go env GOVERSION)
          # A separate network namespace keeps the real nftables rules off the runner.
          docker run --rm --cap-add NET_ADMIN \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$(go env GOMODCACHE),target=/go/pkg/mod,readonly" \
            --mount "type=bind,source=$output,target=/coverage" \
            --workdir /src \
            -e GOTOOLCHAIN=local -e YAGP_TEST_NFT=1 -e YAGP_TEST_UPGRADE=1 \
            "golang:${toolchain#go}-alpine" sh -ec '
              apk add --no-cache bash curl git nftables
              mkdir -p /run/systemd/system
              go test -count=1 -coverprofile=/coverage/go-coverage.out ./...
            '
          total=$(go tool cover -func "$output/go-coverage.out" | awk '/^total:/ {print $NF}')
          printf '### Go test coverage\n\nStatement coverage: **%s**\n' "$total" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v coverage="$total" 'BEGIN { exit !(coverage + 0 > 90) }'; then
            printf 'Go statement coverage must exceed 90%% (actual: %s)\n' "$total" >&2
            exit 1
          fi

  build:
    needs: [version, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate release changelog
        run: go run ./cmd/release-notes -repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - name: Build release binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make release VERSION="$VERSION"

      - name: Package binaries
        run: |
          # 打包 Linux amd64
          tar -czvf yagp-linux-amd64.tar.gz yagp-linux-amd64 config/config.yaml LICENSE
          # 打包 Linux arm64
          tar -czvf yagp-linux-arm64.tar.gz yagp-linux-arm64 config/config.yaml LICENSE
          # 打包 macOS amd64
          tar -czvf yagp-darwin-amd64.tar.gz yagp-darwin-amd64 config/config.yaml LICENSE
          # 打包 macOS arm64
          tar -czvf yagp-darwin-arm64.tar.gz yagp-darwin-arm64 config/config.yaml LICENSE
          # 打包 Windows
          zip yagp-windows-amd64.zip yagp-windows-amd64.exe config/config.yaml LICENSE
          tar -czvf yagp-daemon-linux-amd64.tar.gz yagp-daemon-linux-amd64 yagp-daemon-systemd-linux-amd64 LICENSE
          tar -czvf yagp-daemon-linux-arm64.tar.gz yagp-daemon-linux-arm64 yagp-daemon-systemd-linux-arm64 LICENSE
          tar -czvf yagp-depoly-linux-amd64.tar.gz yagp-depoly-linux-amd64 LICENSE
          tar -czvf yagp-depoly-linux-arm64.tar.gz yagp-depoly-linux-arm64 LICENSE

      - name: Attest the deployment tool archives
        if: github.repository == 'hanzec/yagp' && github.ref == 'refs/heads/master'
        id: depoly-attestation
        uses: actions/attest@v4
        with:
          subject-path: yagp-depoly-linux-*.tar.gz

      - name: Prepare the deployment tool attestation for release
        if: steps.depoly-attestation.outputs.bundle-path != ''
        env:
          ATTESTATION_BUNDLE: ${{ steps.depoly-attestation.outputs.bundle-path }}
        run: jq -c . "$ATTESTATION_BUNDLE" > yagp-depoly-attestations.jsonl

      - name: Check latest release eligibility
        id: latest
        run: |
          default_head=$(git ls-remote origin HEAD)
          if [[ "${default_head%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            yagp-*.tar.gz
            yagp-*.zip
            ${{ steps.depoly-attestation.outputs.bundle-path != '' && 'yagp-depoly-attestations.jsonl' || '' }}
          fail_on_unmatched_files: true
          overwrite_files: false
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: ${{ steps.latest.outputs.value }}

  docker:
    needs: [version, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}

  deploy:
    name: Deploy yagp to production
    needs: docker
    if: >-
      ${{
        github.repository == 'hanzec/yagp' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        vars.YAGP_DEPLOY_ENABLED == 'true'
      }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}
    concurrency:
      group: yagp-production
      queue: max
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - name: Check deployment eligibility
        id: eligibility
        shell: bash
        run: |
          set -euo pipefail
          master_head=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/master)
          if [[ "${master_head%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            printf 'Skipping deployment because master has advanced.\n'
            exit 0
          fi
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing or invalid image digest.' >&2; exit 1; }
          printf 'deploy=true\n' >> "$GITHUB_OUTPUT"

      - name: Notify the deployment webhook
        if: steps.eligibility.outputs.deploy == 'true'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          WEBHOOK_PAYLOAD: ${{ needs.docker.outputs.digest }}
        run: &notify_depoly |
          set -euo pipefail
          : "${WEBHOOK_URL:?Missing webhook URL}"
          : "${WEBHOOK_SECRET:?Missing webhook signing secret}"
          [[ "$WEBHOOK_TOKEN" =~ ^[0-9a-f]{64}$ ]] ||
            { echo 'Webhook token must be 64 lowercase hexadecimal characters.' >&2; exit 1; }
          webhook_token=$WEBHOOK_TOKEN
          unset WEBHOOK_TOKEN
          timestamp=$(date +%s)
          signature=$(WEBHOOK_TIMESTAMP="$timestamp" python3 - <<'PY'
          import hmac
          import os
          import re

          secret = os.environ["WEBHOOK_SECRET"].strip()
          if not re.fullmatch(r"[0-9a-f]{64}", secret):
              raise SystemExit("Webhook signing secret must be 64 lowercase hexadecimal characters.")
          body = os.environ["WEBHOOK_TIMESTAMP"] + "\n" + os.environ["WEBHOOK_PAYLOAD"]
          print("sha256=" + hmac.digest(secret.encode(), body.encode(), "sha256").hex())
          PY
          )
          unset WEBHOOK_SECRET

          status=$(curl -q --proto '=https' --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' --request POST \
            --header @- --data-binary "$WEBHOOK_PAYLOAD" -- "$WEBHOOK_URL" <<EOF
          Authorization: Bearer $webhook_token
          X-Yagp-Timestamp: $timestamp
          X-Yagp-Signature: $signature
          Content-Type: text/plain
          EOF
          )
          if [[ "$status" != 202 ]]; then
            printf 'Webhook rejected the request (HTTP %s).\n' "$status" >&2
            exit 1
          fi
          printf 'Request accepted for %s. Check the server journal for the result.\n' "$WEBHOOK_PAYLOAD"

  upgrade-depoly:
    name: Upgrade the production deployment tool
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.upgrade_depoly &&
        github.repository == 'hanzec/yagp' &&
        github.ref == 'refs/heads/master'
      }}
    runs-on: ubuntu-24.04
    environment: production-tool
    permissions: {}
    concurrency:
      group: yagp-production
      queue: max
      cancel-in-progress: false
    steps:
      - name: Notify the tool upgrade webhook
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.UPGRADE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.UPGRADE_WEBHOOK_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.UPGRADE_WEBHOOK_TOKEN }}
          WEBHOOK_PAYLOAD: upgrade
        run: *notify_depoly
