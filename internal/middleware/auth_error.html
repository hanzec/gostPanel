<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{or .Title .Message}} · yagp</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
  <style>
    :root {
      color-scheme: dark;
      --background: #0b1019;
      --grid: #141c29;
      --panel: #121b29;
      --inset: #101824;
      --border: #29374a;
      --text: #edf4fa;
      --muted: #aebdd0;
      --accent: #58e6ae;
      --on-accent: #091e16;
      --warning: #f3cb79;
      --warning-bg: #33291c;
      --warning-border: #725c33;
      --ops-font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans CJK SC', sans-serif;
      --ops-mono: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      --ops-text-xs: .75rem;
      --ops-text-body: .875rem;
      --ops-text-base: 1rem;
      --ops-text-title: 1.125rem;
      --ops-text-page: clamp(1.5rem, 2.4vw, 2rem);
      --ops-weight-semibold: 600;
      --ops-weight-bold: 700;
      --ops-leading-body: 1.6;
      --ops-leading-heading: 1.4;
      --ops-radius: 12px;
      --ops-radius-inset: 8px;
      --ops-card-padding: 20px;
      --ops-inset-padding: 16px;
      font-family: var(--ops-font-sans);
      font-size: 100%;
    }

    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      margin: 0;
      padding: 24px 16px;
      color: var(--text);
      background-color: var(--background);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
      font-size: var(--ops-text-body);
      line-height: var(--ops-leading-body);
    }

    main { width: min(100%, 640px); min-width: 0; }
    h1, h2, p, dl, dd { margin: 0; }
    .brand, .status, .category {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .brand { margin-bottom: 20px; font-size: var(--ops-text-title); font-weight: var(--ops-weight-bold); }
    .brand-caption, .status-code {
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: var(--ops-radius-inset);
      background: var(--inset);
      color: var(--muted);
      font: var(--ops-weight-semibold) var(--ops-text-xs)/var(--ops-leading-body) var(--ops-mono);
      letter-spacing: 0;
    }
    .card {
      padding: var(--ops-card-padding);
      border: 1px solid var(--border);
      border-radius: var(--ops-radius);
      background: var(--panel);
      overflow-wrap: anywhere;
    }
    .status { justify-content: space-between; margin-bottom: 20px; }
    .category { color: var(--muted); font-weight: var(--ops-weight-semibold); }
    .category svg { color: var(--warning); }
    .status-code { border-color: var(--warning-border); background: var(--warning-bg); color: var(--warning); }
    h1 { margin-bottom: 8px; font-size: var(--ops-text-page); font-weight: var(--ops-weight-bold); line-height: var(--ops-leading-heading); text-wrap: balance; }
    h2 { margin-bottom: 8px; color: var(--text); font-size: var(--ops-text-base); font-weight: var(--ops-weight-semibold); line-height: var(--ops-leading-heading); }
    .description { color: var(--muted); }
    .next { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .diagnostic {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px 16px;
      margin-top: 16px;
      padding: var(--ops-inset-padding);
      border: 1px solid var(--border);
      border-radius: var(--ops-radius-inset);
      background: var(--inset);
      color: var(--muted);
      font-size: var(--ops-text-body);
    }
    code { color: var(--warning); font-family: var(--ops-mono); font-variant-numeric: tabular-nums; }
    .action {
      display: grid;
      place-items: center;
      min-height: 48px;
      margin-top: 24px;
      padding: 8px 16px;
      border-radius: var(--ops-radius-inset);
      background: var(--accent);
      color: var(--on-accent);
      font-weight: var(--ops-weight-semibold);
      text-align: center;
      text-decoration: none;
    }
    .action:hover { background: #83edc3; }
    .action:active { background: #45c995; }
    .action:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    @media (max-width: 700px) {
      :root { --ops-card-padding: 16px; --ops-text-body: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <img src="/favicon.svg" width="24" height="24" alt="">
      <span>yagp</span>
      <span class="brand-caption">GOST CONTROL</span>
    </header>
    <section class="card" aria-labelledby="auth-title">
      <div class="status">
        <div class="category">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10ZM12 8v4m0 4h.01"/>
          </svg>
          <span>访问检查</span>
        </div>
        <span class="status-code">HTTP {{.Status}}</span>
      </div>
      <h1 id="auth-title">{{or .Title .Message}}</h1>
      {{if .Detail}}<p class="description">{{.Detail}}</p>{{end}}
      {{if .NextStep}}
      <div class="next">
        <h2>下一步</h2>
        <p>{{.NextStep}}</p>
      </div>
      {{end}}
      <dl class="diagnostic">
        <dt>诊断代码</dt>
        <dd><code>{{.Reason}}</code></dd>
      </dl>
      <a class="action" href="/">重新打开面板</a>
    </section>
  </main>
</body>
</html>
