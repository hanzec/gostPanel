services:
  yagp:
    image: &yagp-image release.hanzec-overseas.cn/images/yagp:latest
    container_name: yagp
    depends_on:
      yagp-config-init:
        condition: service_completed_successfully
    networks:
      - proxy
    volumes:
      - type: bind
        source: ${PWD:-.}/config
        target: /app/config
        read_only: true
      - type: bind
        source: ${PWD:-.}/data
        target: /app/data
      - type: bind
        source: ${PWD:-.}/logs
        target: /app/logs
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - YAGP_HOST=${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}
      - YAGP_DATABASE_TYPE
      - YAGP_DATABASE_DSN
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_PUBLIC_NETWORK:-${TRAEFIK_NETWORK:-traefik}}
      traefik.http.routers.yagp.rule: "Host(`${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}`)"
      traefik.http.routers.yagp.entrypoints: ${TRAEFIK_PUBLIC_HTTPS_ENTRYPOINT:-${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}}
      traefik.http.routers.yagp.tls: "true"
      traefik.http.routers.yagp.priority: "10"
      traefik.http.routers.yagp.service: yagp
      traefik.http.routers.yagp.middlewares: yagp-authentik,yagp-compress
      traefik.http.middlewares.yagp-compress.compress: "true"
      traefik.http.middlewares.yagp-compress.compress.encodings: gzip
      traefik.http.services.yagp.loadbalancer.server.port: "39100"
      traefik.http.middlewares.yagp-authentik.forwardauth.address: ${AUTHENTIK_OUTPOST_URL:?Set AUTHENTIK_OUTPOST_URL}/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.yagp-authentik.forwardauth.trustforwardheader: "true"
      traefik.http.middlewares.yagp-authentik.forwardauth.authresponseheaders: X-Authentik-Username,X-Authentik-Groups
      traefik.http.routers.yagp-favicon.rule: "Host(`${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}`) && Path(`/favicon.svg`) && (Method(`GET`) || Method(`HEAD`))"
      traefik.http.routers.yagp-favicon.entrypoints: ${TRAEFIK_PUBLIC_HTTPS_ENTRYPOINT:-${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}}
      traefik.http.routers.yagp-favicon.tls: "true"
      traefik.http.routers.yagp-favicon.priority: "20"
      traefik.http.routers.yagp-favicon.service: yagp
      # Node routes authenticate on the report listener and bypass Authentik.
      traefik.http.routers.yagp-node-register.rule: "Host(`${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}`) && Method(`POST`) && Path(`/api/node/v2/register`)"
      traefik.http.routers.yagp-node-register.entrypoints: ${TRAEFIK_PUBLIC_HTTPS_ENTRYPOINT:-${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}}
      traefik.http.routers.yagp-node-register.tls: "true"
      traefik.http.routers.yagp-node-register.priority: "50"
      traefik.http.routers.yagp-node-register.service: yagp-node
      traefik.http.routers.yagp-node-register.middlewares: yagp-node-register-limit
      traefik.http.middlewares.yagp-node-register-limit.ratelimit.average: "6"
      traefik.http.middlewares.yagp-node-register-limit.ratelimit.period: 1m
      traefik.http.middlewares.yagp-node-register-limit.ratelimit.burst: "5"
      # Traefik replaces X-Real-IP from untrusted peers before this middleware runs.
      traefik.http.middlewares.yagp-node-register-limit.ratelimit.sourcecriterion.requestheadername: X-Real-IP
      traefik.http.routers.yagp-node-refresh.rule: "Host(`${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}`) && Method(`POST`) && Path(`/api/node/v2/refresh`)"
      traefik.http.routers.yagp-node-refresh.entrypoints: ${TRAEFIK_PUBLIC_HTTPS_ENTRYPOINT:-${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}}
      traefik.http.routers.yagp-node-refresh.tls: "true"
      traefik.http.routers.yagp-node-refresh.priority: "50"
      traefik.http.routers.yagp-node-refresh.service: yagp-node
      traefik.http.routers.yagp-node-refresh.middlewares: yagp-node-refresh-limit
      traefik.http.middlewares.yagp-node-refresh-limit.ratelimit.average: ${YAGP_REFRESH_RATE_PER_MINUTE:-60}
      traefik.http.middlewares.yagp-node-refresh-limit.ratelimit.period: 1m
      traefik.http.middlewares.yagp-node-refresh-limit.ratelimit.burst: ${YAGP_REFRESH_RATE_BURST:-30}
      traefik.http.middlewares.yagp-node-refresh-limit.ratelimit.sourcecriterion.requestheadername: X-Real-IP
      # Count the WebSocket handshake once, regardless of session length.
      traefik.http.routers.yagp-node-session.rule: "Host(`${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}`) && Method(`GET`) && Path(`/api/node/v2/session`)"
      traefik.http.routers.yagp-node-session.entrypoints: ${TRAEFIK_PUBLIC_HTTPS_ENTRYPOINT:-${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}}
      traefik.http.routers.yagp-node-session.tls: "true"
      traefik.http.routers.yagp-node-session.priority: "50"
      traefik.http.routers.yagp-node-session.service: yagp-node
      traefik.http.routers.yagp-node-session.middlewares: yagp-node-session-limit
      traefik.http.middlewares.yagp-node-session-limit.ratelimit.average: ${YAGP_CONNECT_RATE_PER_MINUTE:-60}
      traefik.http.middlewares.yagp-node-session-limit.ratelimit.period: 1m
      traefik.http.middlewares.yagp-node-session-limit.ratelimit.burst: ${YAGP_CONNECT_RATE_BURST:-30}
      traefik.http.middlewares.yagp-node-session-limit.ratelimit.sourcecriterion.requestheadername: X-Real-IP
      traefik.http.services.yagp-node.loadbalancer.server.port: "39101"
      traefik.http.services.yagp-node.loadbalancer.server.scheme: http
      # Route login and callback requests directly to the outpost to avoid an auth loop.
      traefik.http.routers.yagp-outpost.rule: "Host(`${YAGP_PUBLIC_HOST:-${YAGP_HOST:?Set YAGP_PUBLIC_HOST}}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      traefik.http.routers.yagp-outpost.entrypoints: ${TRAEFIK_PUBLIC_HTTPS_ENTRYPOINT:-${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}}
      traefik.http.routers.yagp-outpost.tls: "true"
      traefik.http.routers.yagp-outpost.priority: "100"
      traefik.http.routers.yagp-outpost.service: yagp-outpost
      traefik.http.services.yagp-outpost.loadbalancer.server.url: ${AUTHENTIK_OUTPOST_URL:?Set AUTHENTIK_OUTPOST_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:39100/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  yagp-config-init:
    image: *yagp-image
    network_mode: none
    healthcheck:
      disable: true
    labels:
      traefik.enable: "false"
    # Mount elsewhere so the bundled template under /app/config stays visible.
    volumes:
      - type: bind
        source: ${PWD:-.}/config
        target: /config-init
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        target=/config-init/config.yaml
        if [ -e "$$target" ] || [ -L "$$target" ]; then
          exit 0
        fi
        tmp=$$(mktemp /config-init/.config.yaml.XXXXXX)
        trap 'rm -f "$$tmp"' EXIT
        cat /app/config/config.yaml > "$$tmp"
        mv -nT "$$tmp" "$$target"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_PUBLIC_NETWORK:-${TRAEFIK_NETWORK:-traefik}}
