services:
  ycgp:
    build: .
    image: ycgp:local
    container_name: ycgp
    ports:
      - "39100:39100"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - YCGP_DATABASE_TYPE
      - YCGP_DATABASE_DSN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:39100/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  data:
  logs:
