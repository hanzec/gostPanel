services:
  yagp:
    build: .
    image: yagp:local
    container_name: yagp
    ports:
      - "127.0.0.1:39100:39100"
      - "39101:39101"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - YAGP_DATABASE_TYPE
      - YAGP_DATABASE_DSN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:39100/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  data:
  logs:
