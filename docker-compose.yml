services:
  yagp:
    image: ghcr.io/hanzec/yagp:latest
    container_name: yagp
    networks:
      - proxy
    volumes:
      - type: bind
        source: ${PWD:-.}/config
        target: /app/config
        read_only: true
      - type: bind
        source: ${PWD:-.}/data
        target: /app/data
      - type: bind
        source: ${PWD:-.}/logs
        target: /app/logs
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - YAGP_DATABASE_TYPE
      - YAGP_DATABASE_DSN
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.yagp.rule: "Host(`${YAGP_HOST:?Set YAGP_HOST}`)"
      traefik.http.routers.yagp.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.yagp.tls: "true"
      traefik.http.routers.yagp.priority: "10"
      traefik.http.routers.yagp.service: yagp
      traefik.http.routers.yagp.middlewares: yagp-authentik
      traefik.http.services.yagp.loadbalancer.server.port: "39100"
      traefik.http.middlewares.yagp-authentik.forwardauth.address: ${AUTHENTIK_OUTPOST_URL:?Set AUTHENTIK_OUTPOST_URL}/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.yagp-authentik.forwardauth.trustforwardheader: "true"
      traefik.http.middlewares.yagp-authentik.forwardauth.authresponseheaders: X-Authentik-Username,X-Authentik-Groups
      # Keep registration limits separate from the persistent stream.
      traefik.http.routers.yagp-grpc-register.rule: "Host(`${YAGP_HOST:?Set YAGP_HOST}`) && Method(`POST`) && Path(`/api/v1/grpc/RegisterNode`)"
      traefik.http.routers.yagp-grpc-register.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.yagp-grpc-register.tls: "true"
      traefik.http.routers.yagp-grpc-register.priority: "50"
      traefik.http.routers.yagp-grpc-register.service: yagp-grpc
      traefik.http.routers.yagp-grpc-register.middlewares: yagp-grpc-register-limit,yagp-grpc-path
      traefik.http.middlewares.yagp-grpc-register-limit.ratelimit.average: "6"
      traefik.http.middlewares.yagp-grpc-register-limit.ratelimit.period: 1m
      traefik.http.middlewares.yagp-grpc-register-limit.ratelimit.burst: "5"
      # Traefik replaces X-Real-IP from untrusted peers before this middleware runs.
      traefik.http.middlewares.yagp-grpc-register-limit.ratelimit.sourcecriterion.requestheadername: X-Real-IP
      # Count each new Connect request once. An open stream does not consume more tokens.
      traefik.http.routers.yagp-grpc-connect.rule: "Host(`${YAGP_HOST:?Set YAGP_HOST}`) && Method(`POST`) && Path(`/api/v1/grpc/Connect`)"
      traefik.http.routers.yagp-grpc-connect.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.yagp-grpc-connect.tls: "true"
      traefik.http.routers.yagp-grpc-connect.priority: "50"
      traefik.http.routers.yagp-grpc-connect.service: yagp-grpc
      traefik.http.routers.yagp-grpc-connect.middlewares: yagp-grpc-connect-limit,yagp-grpc-path
      traefik.http.middlewares.yagp-grpc-connect-limit.ratelimit.average: ${YAGP_CONNECT_RATE_PER_MINUTE:-60}
      traefik.http.middlewares.yagp-grpc-connect-limit.ratelimit.period: 1m
      traefik.http.middlewares.yagp-grpc-connect-limit.ratelimit.burst: ${YAGP_CONNECT_RATE_BURST:-30}
      traefik.http.middlewares.yagp-grpc-connect-limit.ratelimit.sourcecriterion.requestheadername: X-Real-IP
      traefik.http.routers.yagp-grpc.rule: "Host(`${YAGP_HOST:?Set YAGP_HOST}`) && Method(`POST`) && Path(`/api/v1/grpc/GetNftTemplate`)"
      traefik.http.routers.yagp-grpc.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.yagp-grpc.tls: "true"
      traefik.http.routers.yagp-grpc.priority: "50"
      traefik.http.routers.yagp-grpc.service: yagp-grpc
      traefik.http.routers.yagp-grpc.middlewares: yagp-grpc-path
      traefik.http.middlewares.yagp-grpc-path.replacepathregex.regex: "^/api/v1/grpc/([^/]+)$"
      traefik.http.middlewares.yagp-grpc-path.replacepathregex.replacement: "/yagp.v1/$${1}"
      traefik.http.services.yagp-grpc.loadbalancer.server.port: "39101"
      traefik.http.services.yagp-grpc.loadbalancer.server.scheme: h2c
      # Route login and callback requests directly to the outpost to avoid an auth loop.
      traefik.http.routers.yagp-outpost.rule: "Host(`${YAGP_HOST:?Set YAGP_HOST}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      traefik.http.routers.yagp-outpost.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.yagp-outpost.tls: "true"
      traefik.http.routers.yagp-outpost.priority: "100"
      traefik.http.routers.yagp-outpost.service: yagp-outpost
      traefik.http.services.yagp-outpost.loadbalancer.server.url: ${AUTHENTIK_OUTPOST_URL:?Set AUTHENTIK_OUTPOST_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:39100/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
