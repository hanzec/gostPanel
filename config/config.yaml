server:
  port: ":39100"
  mode: "release"  # debug, release

database:
  type: "sqlite"  # sqlite 或 mysql，也可用 YAGP_DATABASE_TYPE
  path: "./data/gost-panel.db"  # SQLite 文件路径
  dsn: ""  # MySQL 连接串，也可用 YAGP_DATABASE_DSN

authentik:
  trusted_proxies: ["127.0.0.1", "::1"]
  admin_group: "yagp-admins"

report:
  listen: ""
  address: ""  # Traefik 部署使用 主机:端口/api/v1/grpc；直连使用 主机:端口
  # Compose 的 Traefik 回源使用内部端口，proxy_ip 可选。
  # 直连时省略 cert_file 和 key_file 即自动生成并保存证书。

log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, console
  output: "./logs/app.log"
