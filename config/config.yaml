host: ""  # 面板对外的域名或 IP。Compose 可通过 .env 中的 YAGP_PUBLIC_HOST 配置。

server:
  port: ":39100"
  mode: "release"  # debug, release

database:
  type: "sqlite"  # sqlite 或 mysql，也可用 YAGP_DATABASE_TYPE
  path: "./data/gost-panel.db"  # SQLite 文件路径
  dsn: ""  # MySQL 连接串，也可用 YAGP_DATABASE_DSN

geoip:
  download_url: ""  # .mmdb 文件直链，留空使用项目默认下载地址

authentik:
  trusted_proxies: ["127.0.0.1", "::1"]
  admin_group: "yagp-admins"

report:
  listen: ""
  # Compose 的 Traefik 通过 HTTP 转发到内部端口 :39101。
  # HTTPS/WSS 直连时设置 direct_tls: true，省略 cert_file 和 key_file 即自动生成证书。

log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, console
  output: "./logs/app.log"
